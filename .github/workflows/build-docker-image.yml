name: Build Docker Image

on:
  workflow_call:
    inputs:
      aws-region:
        required: true
        type: string
      build-args:
        required: false
        default: ''
        type: string
      docker-context:
        required: true
        type: string
      ecr-repository:
        required: true
        type: string
      file:
        required: false
        type: string
      github-actions-role:
        required: true
        type: string
      image-tag:
        required: true
        type: string
      architectures:
        required: false
        default: '["amd64"]'
        type: string
      arm64-runner:
        required: false
        default: ubuntu-26.04-arm
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build-docker-image:
    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.architectures) }}
    runs-on: ${{ matrix.arch == 'arm64' && inputs.arm64-runner || 'ubuntu-26.04' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.github-actions-role }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to Amazon ECR
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ inputs.ecr-repository }}:${{ inputs.image-tag }}-${{ matrix.arch }}
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.file }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gh,scope=${{ inputs.ecr-repository }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.ecr-repository }}-${{ matrix.arch }}

  merge:
    needs: build-docker-image
    runs-on: ubuntu-26.04

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.github-actions-role }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Publish combined image
        env:
          IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ inputs.ecr-repository }}
          TAG: ${{ inputs.image-tag }}
          ARCHS: ${{ join(fromJSON(inputs.architectures), ' ') }}
        run: |
          SOURCES=""
          for arch in $ARCHS; do SOURCES="$SOURCES $IMAGE:$TAG-$arch"; done
          docker buildx imagetools create -t "$IMAGE:$TAG" -t "$IMAGE:latest" $SOURCES
          echo "Image: $IMAGE:$TAG" >> $GITHUB_STEP_SUMMARY

    outputs:
      image: ${{ steps.ecr-login.outputs.registry }}/${{ inputs.ecr-repository }}:${{ inputs.image-tag }}
